# Publishes the site/ folder to GitHub Pages.
# Runs after each data update on main, when site code changes on main,
# or when you press "Run workflow" on the Actions tab.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publish site

on:
  workflow_call: {}
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/publish-site.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # take the newest commit, including data saved a moment ago by "Update data"
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
